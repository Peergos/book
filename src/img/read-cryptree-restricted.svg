<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 860" width="1660" height="860" font-family="Montserrat, Helvetica, Arial, sans-serif" fill="#2c3e50">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/>
    </marker>
    <style>
      .k { stroke: none; }
      .r { stroke: #f0a500; stroke-width: 5; }
      .l { fill: none; stroke: #2c3e50; stroke-width: 5; marker-end: url(#a); }
      .d { stroke-dasharray: 12 8; }
      .h { fill: none; stroke: #fff; stroke-width: 16; }
      .t { font-size: 26px; text-anchor: middle; }
      .s { font-size: 17px; font-style: italic; text-anchor: middle; }
      .lab { font-size: 16px; font-style: italic; }
      .hd { font-size: 30px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1660" height="860" fill="#fff"/>

  <text class="hd" x="40" y="60">DIRECTORY</text>
  <text class="hd" x="580" y="60">SUB-DIRECTORY</text>
  <text class="hd" x="1120" y="60">FILE</text>

  <!-- vertical arrows within each column, drawn first so crossing arrows bridge over them -->
  <!-- directory -->
  <path class="l d" d="M140,160 V224"/>
  <path class="l" d="M390,160 V364"/>
  <path class="l" d="M140,300 V504"/>
  <path class="l d" d="M390,440 V504"/>
  <path class="l" d="M265,580 V622"/>
  <!-- sub-directory -->
  <path class="l d" d="M680,160 V224"/>
  <path class="l" d="M930,160 V364"/>
  <path class="l" d="M680,300 V504"/>
  <path class="l d" d="M930,440 V504"/>
  <path class="l" d="M805,580 V622"/>
  <!-- file -->
  <path class="l d" d="M1220,160 V224"/>
  <path class="l" d="M1220,300 V364"/>
  <path class="l" d="M1220,440 V500"/>
  <path class="l" d="M1320,265 H1384"/>

  <!-- child entries -->
  <path class="l" d="M1140,160 V196 H1075 V405 H1036"/>
  <path class="h" d="M780,265 H1114"/>
  <path class="l" d="M780,265 H1114"/>
  <path class="l" d="M490,125 H574"/>
  <path class="l" d="M1030,125 H1114"/>
  <path class="h" d="M240,265 H574"/>
  <path class="l" d="M240,265 H574"/>
  <text class="lab" x="420" y="252">child entry</text>
  <text class="lab" x="960" y="252">child entry</text>

  <!-- parent links (q) -->
  <path class="h" d="M830,405 H496"/>
  <path class="l" d="M830,405 H496"/>
  <text class="lab" x="510" y="392">parent link</text>
  <text class="lab" transform="translate(1062,400) rotate(-90)">parent link</text>

  <!-- directory keys -->
  <rect class="k" x="40" y="90" width="450" height="70" rx="14" fill="#26b99a"/>
  <text class="t" x="265" y="134">Base key B</text>
  <rect class="r" x="40" y="230" width="200" height="70" rx="14" fill="#26b99a"/>
  <text class="t" x="140" y="263">Restricted key</text>
  <text class="s" x="140" y="288">R = KDF(B)</text>
  <rect class="k" x="290" y="370" width="200" height="70" rx="14" fill="#26b99a"/>
  <text class="t" x="390" y="414">Parent key P</text>
  <rect class="r" x="40" y="510" width="450" height="70" rx="14" fill="#26b99a"/>
  <text class="t" x="265" y="543">Properties key</text>
  <text class="s" x="265" y="568">P′ = KDF(P)</text>
  <text class="t" x="265" y="660" font-size="34" font-style="italic">ianopolous</text>

  <!-- sub-directory keys -->
  <rect class="k" x="580" y="90" width="450" height="70" rx="14" fill="#42d6b5"/>
  <text class="t" x="805" y="134">Base key B</text>
  <rect class="r" x="580" y="230" width="200" height="70" rx="14" fill="#42d6b5"/>
  <text class="t" x="680" y="263">Restricted key</text>
  <text class="s" x="680" y="288">R = KDF(B)</text>
  <rect class="k" x="830" y="370" width="200" height="70" rx="14" fill="#42d6b5"/>
  <text class="t" x="930" y="414">Parent key P</text>
  <rect class="r" x="580" y="510" width="450" height="70" rx="14" fill="#42d6b5"/>
  <text class="t" x="805" y="543">Properties key</text>
  <text class="s" x="805" y="568">P′ = KDF(P)</text>
  <text class="t" x="805" y="660" font-size="34" font-style="italic">work</text>

  <!-- file keys -->
  <rect class="k" x="1120" y="90" width="450" height="70" rx="14" fill="#9ae9d8"/>
  <text class="t" x="1345" y="134">Base key B</text>
  <rect class="r" x="1120" y="230" width="200" height="70" rx="14" fill="#9ae9d8"/>
  <text class="t" x="1220" y="263">Restricted key</text>
  <text class="s" x="1220" y="288">R = KDF(B)</text>
  <rect class="r" x="1120" y="370" width="200" height="70" rx="14" fill="#9ae9d8"/>
  <text class="t" x="1220" y="414">Data key</text>
  <text class="t" x="1220" y="534" font-size="30">File contents</text>
  <text class="s" x="1505" y="248" font-size="19">CV.docx  72 KiB</text>
  <text class="s" x="1505" y="273" font-size="19">Modified: 15:23 14/3/2020</text>
  <text class="s" x="1505" y="298" font-size="19">text/plain</text>

  <!-- legend -->
  <path class="l" d="M40,740 H130"/>
  <text x="150" y="747" font-size="20">holds the key it points to, encrypted under the source key</text>
  <path class="l d" d="M40,790 H130"/>
  <text x="150" y="797" font-size="20">derives the key it points to (one way)</text>
  <rect class="r" x="820" y="720" width="90" height="40" rx="10" fill="#fff"/>
  <text x="930" y="747" font-size="20">reachable from a location-hiding link to the directory</text>
  <text x="820" y="797" font-size="20">A full holder starts at a Base key and reaches everything.</text>
</svg>
