<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 600" width="1370" height="600" font-family="Montserrat, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c3e50"/>
    </marker>
  </defs>
  <rect width="1370" height="600" fill="#ffffff"/>

  <g font-size="26" font-weight="bold" fill="#2c3e50" text-anchor="middle">
    <text x="180" y="50">DIRECTORY</text>
    <text x="570" y="50">SUB-DIRECTORY</text>
    <text x="960" y="50">FILE</text>
  </g>

  <g fill="none" stroke="#2c3e50" stroke-width="5" marker-end="url(#head)">
    <!-- full key to its parent key, which only the full key unwraps -->
    <path d="M90,200 V144"/>
    <path d="M480,200 V144"/>
    <!-- parent links lead back up -->
    <path d="M420,108 H218"/>
    <path d="M870,200 V108 H608"/>
    <!-- the restricted key is derived from the full key, one way -->
    <path d="M235,256 V312"/>
    <path d="M625,256 V312"/>
    <path d="M1015,256 V312"/>
    <!-- a directory gives its children's keys: full from full, restricted from restricted -->
    <path d="M330,228 H412"/>
    <path d="M720,228 H802"/>
    <path d="M330,348 H522"/>
    <path d="M720,348 H912"/>
    <!-- what the restricted key opens -->
    <path d="M235,376 V428"/>
    <path d="M625,376 V428"/>
    <path d="M1110,348 H1142"/>
    <path d="M1015,376 V432"/>
    <path d="M1015,496 V520"/>
  </g>

  <g font-size="16" font-style="italic" fill="#2c3e50">
    <text x="245" y="290">derive</text>
    <text x="635" y="290">derive</text>
    <text x="1025" y="290">derive</text>
    <text x="319" y="96" text-anchor="middle">parent link</text>
    <text x="739" y="96" text-anchor="middle">parent link</text>
  </g>

  <g>
    <rect x="30" y="80" width="180" height="56" rx="12" fill="#42d9b8"/>
    <rect x="420" y="80" width="180" height="56" rx="12" fill="#42d9b8"/>

    <rect x="30" y="200" width="300" height="56" rx="12" fill="#26b99a"/>
    <rect x="420" y="200" width="300" height="56" rx="12" fill="#26b99a"/>
    <rect x="810" y="200" width="300" height="56" rx="12" fill="#26b99a"/>

    <rect x="140" y="320" width="190" height="56" rx="12" fill="#9ae9d9"/>
    <rect x="530" y="320" width="190" height="56" rx="12" fill="#9ae9d9"/>
    <rect x="920" y="320" width="190" height="56" rx="12" fill="#9ae9d9"/>

    <rect x="920" y="440" width="190" height="56" rx="12" fill="#9ae9d9"/>
  </g>

  <g font-size="22" fill="#2c3e50" text-anchor="middle">
    <text x="120" y="116">Parent key</text>
    <text x="510" y="116">Parent key</text>
    <text x="180" y="236">Full key</text>
    <text x="570" y="236">Full key</text>
    <text x="960" y="236">Full key</text>
    <text x="235" y="356">Restricted key</text>
    <text x="625" y="356">Restricted key</text>
    <text x="1015" y="356">Restricted key</text>
    <text x="1015" y="476">Data key</text>
  </g>

  <g fill="#2c3e50">
    <text x="235" y="462" font-size="26" font-style="italic" text-anchor="middle">ianopolous</text>
    <text x="625" y="462" font-size="26" font-style="italic" text-anchor="middle">work</text>
    <text x="1015" y="552" font-size="24" text-anchor="middle">File contents</text>
    <g font-size="17" font-style="italic">
      <text x="1150" y="330">CV.docx  72 KiB</text>
      <text x="1150" y="354">Modified: 15:23 14/3/2020</text>
